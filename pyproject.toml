[project]
name = "corei-os"
version = "0.4.0"
description = "COREI OS — institutional intelligence and execution platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "uvicorn>=0.32,<1",
]

[project.scripts]
corei-os = "corei.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "pending(finding, delivery): acceptance scenario for a finding not yet implemented",
    "integration: needs Postgres (COREI_TEST_DATABASE_URL)",
    "kafka: needs a Kafka broker (COREI_TEST_KAFKA_BOOTSTRAP)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]
# SQL statements are kept whole for readability.
"src/corei/ledger/store.py" = ["E501"]
"src/corei/control/store.py" = ["E501"]
# Commands import their dependencies lazily so `corei-os version` and package scripts start fast.
"src/corei/cli.py" = ["PLC0415"]
# Raw SQL fixtures that recreate older schemas are kept on one line each.
"tests/integration/test_tenancy.py" = ["E501"]
"src/corei/reference/store.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["corei"]
