name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12 and locked dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12

      - name: Repo hygiene (secrets, vendored deps, runtime output, empty placeholders)
        run: uv run python scripts/repo_hygiene.py

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Contract drift (JSON Schemas and vectors match the Python contracts)
        run: |
          uv run python scripts/export_schemas.py --check
          uv run python scripts/make_vectors.py --check

      - name: Tests (unit, contract, acceptance register)
        run: uv run pytest -ra
