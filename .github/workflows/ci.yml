name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Open-source gitleaks binary, pinned by checksum (gitleaks-action needs a license for orgs).
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12 and locked dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12

      - name: Repo hygiene (secrets, vendored deps, runtime output, empty placeholders)
        run: uv run python scripts/repo_hygiene.py

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Contract drift (JSON Schemas and vectors match the Python contracts)
        run: |
          uv run python scripts/export_schemas.py --check
          uv run python scripts/make_vectors.py --check

      - name: Tests (unit, contract, acceptance register)
        run: uv run pytest -ra
